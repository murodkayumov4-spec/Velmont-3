services:
  - type: web
    name: velmont
    runtime: node
    plan: free
    buildCommand: echo "no build"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "@velmont_shop"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SITE_URL
        value: https://velmontstyle.uz
      - key: BACKUP_CHAT_ID
        sync: false
      # Онлайн-оплата (необязательно, заполните то, что подключили)
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
