services:
  - type: web
    name: velmont
    runtime: node
    plan: free
    buildCommand: echo "no build"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "@velmont_shop"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
